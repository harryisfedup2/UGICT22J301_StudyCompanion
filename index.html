
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UGICT22J301 - Java Study Companion</title>

  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      overflow: auto;
    }

    #status {
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
    }
  </style>
</head>

<body>

  <div id="status">
    Loading UGICT22J301 Study Companion...
  </div>

  <script type="module">

    const status = document.getElementById("status");

    try {

      status.textContent = "Initializing Java runtime...";

      await cheerpjInit();

      status.textContent = "Starting Study Companion...";

      cheerpjCreateDisplay(-1, -1);

      const repoPath = window.location.pathname.replace(/\/$/, "");

      const jarPath = "/app" + repoPath + "/JavaCourseCompanion.jar";

      console.log("Loading JAR:", jarPath);

      status.style.display = "none";

      await cheerpjRunJar(jarPath);

    } catch (error) {

      status.style.display = "block";

      status.textContent =
        "Application failed to start: " + error.message;

      console.error("Study Companion Error:", error);

    }

  </script>

</body>
</html>
